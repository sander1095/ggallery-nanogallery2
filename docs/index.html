<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Test Gallery</title>
    
    <meta name="viewport"
          content="user-scalable=no, width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="description"
          content="A beautiful photo gallery showcasing various images.">
    <meta name="keywords" content="photo, gallery, images, photography">
    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.3.1/dist/jquery.min.js"
            type="text/javascript"></script>
    <!-- nanogallery2 -->
    <link href="https://cdn.jsdelivr.net/npm/nanogallery2@3/dist/css/nanogallery2.min.css"
          rel="stylesheet"
          type="text/css">
    <script type="text/javascript"
            src="https://cdn.jsdelivr.net/npm/nanogallery2@3/dist/jquery.nanogallery2.min.js"></script>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <script src="https://kit.fontawesome.com/8689469c8f.js"
            crossorigin="anonymous"></script>
  </head>
  <body class="dark-mode">
    <nav class="navbar">
      <div class="navbar-start">
        <div class="navbar-item">
          
          <button id="previous-toggle" class="button is-dark hidden">
            <span class="icon">
              <i class="fa-solid fa-left-long"></i>
            </span>
          </button>
          
        </div>
      </div>
      <div class="navbar-end">
        
        
        <div class="navbar-item">
          <button id="theme-toggle" class="button is-dark">
            <span class="icon">
              <i class="fa-solid fa-moon hidden"></i>
              <i class="fa-solid fa-sun"></i>
            </span>
          </button>
        </div>
      </div>
    </nav>
    <h1 class="title is-2 is-spaced"></h1>
    <h2 class="subtitle is-6"></h2>
    <div id="nanogallery"></div>
    <footer>
      <p class="content">
        Made with <a target="_blank" href="https://nanogallery2.nanostudio.org">nanogallery2</a>

        Generated by <a target="_blank" href="https://github.com/creeston/ggallery">ggallery</a>
      </p>
    </footer>
  </body>
  <script>
    const galleryItems = [
      
      {
        src: '4046386/pexels-photo-4046386.png?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=2',
        
        ID: '1000000',
        kind: 'album',
        
        title: 'Italy',
      },
      
      {
        src: '590478/pexels-photo-590478.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1',
        
        ID: '1000001',
        kind: 'album',
        
        title: 'Japan',
      }
      
    ];

    const albums =  {
        
            '1000000': {
              subtitle: 'A collection of images from Italy',
              route: 'italy',
              title: 'Italy',
            }
        ,
        
            '1000001': {
              
              route: 'japan',
              title: 'Japan',
            }
        
        
    };

    // The album the visitor currently has open. Re-ordering rebuilds the gallery
    // from scratch, and this is what lets us put them back where they were.
    let openAlbumId = null;

    const galleryOptions = {
      itemsBaseURL: 'https://images.pexels.com/photos/',

      thumbnailHeight: '800', thumbnailWidth: 'auto',
      thumbnailAlignment: 'fillWidth',
      displayBreadcrumb: false,
      thumbnailL1Label: { display: true, valign: 'bottom', hideIcons: true, titleFontSize: '1.2em', align: 'left', titleMultiLine: true, displayDescription: false },
      thumbnailL1BuildInit2: 'title_font-weight_bold|label_left_5px',
      thumbnailToolbarImage: { topLeft: '', bottomRight: '', topRight: '', bottomLeft: '' },
      thumbnailToolbarAlbum: { topLeft: '', topRight: '', bottomLeft: '', bottomRight: '' },
      thumbnailDisplayTransitionDuration: 100,
      thumbnailDisplayInterval: 100,
      thumbnailDisplayOrder: 'rowByRow',
      thumbnailBorderHorizontal: 0,
      thumbnailBorderVertical: 0,
      thumbnailGutterWidth: 5,
      thumbnailGutterHeight: 5,
      thumbnailL1GutterWidth: 15,
      thumbnailL1GutterHeight: 15,

      
      thumbnailL1HoverEffect2: [
        { 'name': 'imageGrayOff' },
        { 'name': 'labelOpacity50', "duration": 1000 },
        { 'name': 'label_scale_1.0_0.8', "duration": 1000 },
        { 'name': 'imageScaleIn80', "duration": 1000 },
      ],
      
      thumbnailHoverEffect2: 'labelAppear',
      touchAnimation: true,
      touchAutoOpenDelay: -1,
      viewerToolbar: { standard: 'label', minimized: 'label', "display": true, },
      viewerTools: { topLeft: '', topRight: 'closeButton', bottomLeft: '', bottomRight: '', },
      viewerGallery: "none",
      imageTransition: 'slide',
      thumbnailSelectable: false,
      fnThumbnailSelection: function() {
        refreshSelectionState();
      },
      galleryTheme: {
        thumbnail: { titleShadow: 'none', descriptionShadow: 'none', titleColor: '#fff', borderColor: '#fff', borderSize: 0, background: '#111' },
      },

      fnGalleryRenderEnd: function(e) {
        
          let title = e.title;
          let subtitle = "";
          if (e.albumID === '-1') {
            title = "Test Gallery";
            subtitle = "A collection of test images from Pexels";
          } else {
            let album = albums[e.GetID()];
            if (album) {
            
              navigateToAlbum(album);
            
            }
          }
        

        const previousAlbumId = openAlbumId;
        openAlbumId = e.albumID === '-1' ? null : e.GetID();

        // Navigating to another album (or back to the album list) throws the
        // selection away, so select mode is left as well.
        if (previousAlbumId !== openAlbumId) {
          leaveSelectMode();
        }
        updateSelectModeVisibility();

        if (title) {
          $('.title').text(title);
        } else 
        {
          $('.title').text('');
        }
        if (subtitle) {
          $('.subtitle').text(subtitle);
        } else {
          $('.subtitle').text('');
        }

        
      },

      locationHash: false
    };

    const ORDER_SWITCHER_ENABLED = false;
    const ORDERS = ['date', 'random'];

    // The chosen order lives in the URL, so it survives a reload and can be shared.
    function currentOrder() {
      if (!ORDER_SWITCHER_ENABLED) {
        return ORDERS[0];
      }
      const requested = new URLSearchParams(window.location.search).get('order');
      return ORDERS.indexOf(requested) !== -1 ? requested : ORDERS[0];
    }

    function writeOrderToUrl(order) {
      const url = new URL(window.location.href);
      url.searchParams.set('order', order);
      window.history.replaceState(null, '', url);
    }

    function shuffleRange(items, from, to) {
      for (let i = to - 1; i > from; i--) {
        const j = from + Math.floor(Math.random() * (i - from + 1));
        const swap = items[i];
        items[i] = items[j];
        items[j] = swap;
      }
    }

    // Each album entry is followed by its own photos, so the shuffle is applied to
    // every run of photos in between. Album covers keep their configured position.
    function itemsInOrder(order) {
      const items = galleryItems.slice();
      if (order !== 'random') {
        return items;
      }
      let start = 0;
      for (let i = 0; i <= items.length; i++) {
        if (i === items.length || items[i].kind === 'album') {
          shuffleRange(items, start, i);
          start = i + 1;
        }
      }
      return items;
    }

    let galleryRendered = false;

    const SELECT_MODE_ENABLED = false;
    const PHOTOS_AT_TOP_LEVEL = false;
    const DOWNLOAD_LABEL = "Download";
    // Browsers throttle (or block) a burst of downloads, so they are spaced out.
    const DOWNLOAD_INTERVAL_MS = 400;

    let selectModeActive = false;

    function galleryInstance() {
      return galleryRendered ? jQuery('#nanogallery').nanogallery2('instance') : null;
    }

    // The photos of the album that is currently on screen, album covers excluded.
    function displayedPhotos() {
      const instance = galleryInstance();
      if (instance === null) {
        return [];
      }
      const photos = [];
      instance.GOM.items.forEach(function(gomItem) {
        const item = instance.I[gomItem.thumbnailIdx];
        if (item && item.kind === 'image') {
          photos.push(item);
        }
      });
      return photos;
    }

    function selectedPhotos() {
      if (!galleryRendered) {
        return [];
      }
      return jQuery('#nanogallery').nanogallery2('itemsSelectedGet').filter(function(item) {
        return item.kind === 'image';
      });
    }

    function setSelected(items, selected) {
      if (items.length > 0) {
        jQuery('#nanogallery').nanogallery2('itemsSetSelectedValue', items, selected);
      }
      refreshSelectionState();
    }

    // nanogallery2 only turns a thumbnail click into a selection while its own
    // counter says at least one thumbnail is selected. Keeping that counter above
    // zero for as long as select mode lasts makes every click select instead of
    // opening the viewer, so no photo has to be selected through its checkbox first.
    function refreshSelectionState() {
      const instance = galleryInstance();
      const count = selectedPhotos().length;
      if (instance !== null) {
        instance.GOM.nbSelected = selectModeActive ? count + 1 : count;
      }
      if (SELECT_MODE_ENABLED) {
        $('#download-selected').prop('disabled', count === 0);
        $('#download-selected-label').text(count > 0 ? DOWNLOAD_LABEL + ' (' + count + ')' : DOWNLOAD_LABEL);
      }
    }

    // Album covers are not selectable, so the button only shows on a page of photos.
    function updateSelectModeVisibility() {
      if (!SELECT_MODE_ENABLED) {
        return;
      }
      const photosDisplayed = PHOTOS_AT_TOP_LEVEL || openAlbumId !== null;
      $('#select-toggle-item').toggleClass('hidden', !photosDisplayed || selectModeActive);
      $('#select-actions').toggleClass('hidden', !photosDisplayed || !selectModeActive);
    }

    function enterSelectMode() {
      if (!SELECT_MODE_ENABLED || selectModeActive) {
        return;
      }
      selectModeActive = true;
      // Also re-renders the gallery, which is what makes the checkboxes appear.
      jQuery('#nanogallery').nanogallery2('option', 'thumbnailSelectable', true);
      updateSelectModeVisibility();
      refreshSelectionState();
    }

    function leaveSelectMode() {
      if (!selectModeActive) {
        return;
      }
      selectModeActive = false;
      // Clears the selection and re-renders the gallery without the checkboxes.
      jQuery('#nanogallery').nanogallery2('option', 'thumbnailSelectable', false);
      updateSelectModeVisibility();
      refreshSelectionState();
    }

    // Same approach as nanogallery2's own download tool, one photo after another.
    function downloadItem(item) {
      const url = item.downloadURL ? item.downloadURL : item.src;
      const link = document.createElement('a');
      link.href = url;
      link.download = url.split('/').pop().split('?')[0];
      link.target = '_blank';
      link.rel = 'noopener';
      link.style.display = 'none';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function downloadSelectedPhotos() {
      selectedPhotos().forEach(function(item, index) {
        window.setTimeout(function() {
          downloadItem(item);
        }, index * DOWNLOAD_INTERVAL_MS);
      });
    }

    function renderGallery(order) {
      const $gallery = jQuery('#nanogallery');
      const reopenAlbumId = galleryRendered ? openAlbumId : null;

      if (galleryRendered) {
        $gallery.nanogallery2('destroy');
      }
      // A rebuilt gallery starts out unselectable, so select mode restarts too.
      selectModeActive = false;
      $gallery.nanogallery2(Object.assign({}, galleryOptions, { items: itemsInOrder(order) }));
      galleryRendered = true;
      updateSelectModeVisibility();
      refreshSelectionState();

      if (reopenAlbumId !== null) {
        // Deferred, so nanogallery2 can finish its initial render first.
        window.setTimeout(function() {
          jQuery('#nanogallery').nanogallery2('displayItem', String(reopenAlbumId));
        }, 0);
      }
    }

    function navigateToAlbum(album) {
      if (window.location.pathname.endsWith('/index.html')) {
        window.location = album.route + '/index.html';
      } else {
        window.location = album.route + '/';
      }
    }

    function navigateToAlbums() {
      var instance = $('#nanogallery').nanogallery2('instance');
      instance.GOM.albumIdx = 0;
      instance.GOM.curNavLevel = 'l1';
      instance.Refresh();
    }

    $('#previous-toggle').on('click', function() {
      leaveSelectMode();
      
        navigateToAlbums();
      
    });

    $('#theme-toggle').on('click', function() {
      $('body').toggleClass('dark-mode');
      $('.fa-moon').toggleClass('hidden');
      $('.fa-sun').toggleClass('hidden');
      $('#theme-toggle').toggleClass('is-dark is-light');
      $('#previous-toggle').toggleClass('is-dark is-light');
      $('.select-mode-button').toggleClass('is-dark is-light');

      if ($('body').hasClass('dark-mode')) {
        localStorage.setItem('theme', 'dark');
      } else {
        localStorage.setItem('theme', 'light');
      }
    });

    $('#select-toggle').on('click', enterSelectMode);
    $('#select-cancel').on('click', leaveSelectMode);

    $('#select-all').on('click', function() {
      setSelected(displayedPhotos(), true);
    });

    $('#select-none').on('click', function() {
      setSelected(selectedPhotos(), false);
    });

    $('#download-selected').on('click', downloadSelectedPhotos);

    $('#order-select').on('change', function() {
      const order = ORDERS.indexOf(this.value) !== -1 ? this.value : ORDERS[0];
      writeOrderToUrl(order);
      renderGallery(order);
    });

    $(document).ready(function() {
      if (localStorage.getItem('theme') === 'light') {
        $('body').removeClass('dark-mode');
        $('.fa-moon').addClass('hidden');
        $('.fa-sun').removeClass('hidden');
        $('#theme-toggle').addClass('is-light');
        $('#theme-toggle').removeClass('is-dark');
        $('#previous-toggle').addClass('is-light');
        $('#previous-toggle').removeClass('is-dark');
        $('.select-mode-button').addClass('is-light');
        $('.select-mode-button').removeClass('is-dark');
      }

      const order = currentOrder();
      if (ORDER_SWITCHER_ENABLED) {
        $('#order-select').val(order);
        writeOrderToUrl(order);
      }
      renderGallery(order);
    });

    // Force page refresh on back/forward navigation
    // Necessary for nanogallery state consistency
    window.addEventListener("pageshow", function (event) {
      var historyTraversal = event.persisted ||
        (typeof window.performance != "undefined" &&
          window.performance.navigation.type === 2);
      if (historyTraversal) {
        // Handle page restore.
        window.location.reload();
      }
    });
  </script>
</html>
<style>
  #nanogallery {
    padding-left: 12px;
    padding-right: 12px;
  }

  body.dark-mode {
    background-color: #121212;
    color: #ffffff;
    min-height: 100vh;
  }

  .navbar {
    background-color: transparent;
  }

  .title {
    font-family: 'Roboto', sans-serif;
    font-size: 2em;
    text-align: center;
    margin-top: 20px;
  }

  body.dark-mode .title {
    color: #bababa;
  }

  body.dark-mode footer {
    color: #bababa;
  }

  .hidden {
    display: none;
  }

  .subtitle {
    text-align: center;
  }

  body {
    padding-bottom: 20px;
  }

  footer {
    position: fixed;
    bottom: 5px;
    left: 12px;
  }

  a {
    text-decoration: underline;
    color: inherit;
  }

  footer p {
    font-size: 0.8em;
  }

  .nGY2 .toolbar .label .title {
    font-size: 0.9em;
    font-weight: normal;
    font-family: var(--bulma-body-family);
  }

  .nGY2 .toolbar .label .title:hover {
    color: #fff;
  }

  .nGY2 .ngy2viewerToolAction:hover {
    opacity: 1;
  }

  /* Select mode */

  #select-actions .buttons {
    margin-bottom: 0;
    flex-wrap: nowrap;
  }

  #select-actions .buttons .button {
    margin-bottom: 0;
  }

  /* nanogallery2 only scales a selected thumbnail down slightly, which is easy to
     miss, so selected photos get a border of their own as well. */
  #nanogallery .nGY2GThumbnailSubSelected {
    outline: 3px solid #3e8ed0;
    outline-offset: -3px;
  }

  /* Order switcher, kept in step with the theme toggle sitting next to it. */

  #order-switcher select {
    background-color: #fff;
    border-color: #dbdbdb;
    color: #363636;
  }

  body.dark-mode #order-switcher select {
    background-color: #363636;
    border-color: #363636;
    color: #f5f5f5;
  }

  body.dark-mode #order-switcher:not(.is-multiple):not(.is-loading)::after {
    border-color: #f5f5f5;
  }

  /* Overriding bulma navbar styles, so that it remains same even on smaller screens. */

  .navbar {
    display: flex;
  }

  .navbar-start {
    display: flex;
    justify-content: flex-start;
    align-items: stretch;
    margin-inline-end: auto;
  }

  .navbar-end {
    justify-content: flex-end;
    display: flex;
    align-items: stretch;
    margin-inline-start: auto;
  }

</style>
